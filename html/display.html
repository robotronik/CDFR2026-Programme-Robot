<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Live Table</title>
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        canvas {
            border: 2px solid white;
            width: 100%;
            height: auto;
            background:
                url('/assets/background.svg') center / calc(100% * 3000 / 3300) calc(100% * 2000 / 2300) no-repeat,
                linear-gradient(silver, silver) center / calc(100% * 3044 / 3300) calc(100% * 2044 / 2300) no-repeat #f1f1f1;
        }
        .simulation canvas {
            display: block;
            max-width: 110vh;
            margin-inline: auto;
            aspect-ratio: 33 / 23;
        }
        .simulation #colorLabel {
            display: none;
        }
        #simulationToolbar h3 {
            font-size: 1rem;
        }
        .status-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: red;
            transition: background-color 0.5s ease;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Placeholder for the navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-center align-items-center">
            <h1 class="text-white mb-0" id="pageTitle">2D Table and Robot Display</h1>
            <span class="status-dot ms-3" id="statusDot"></span>
        </div>
    </div>

    <div id="simulationControls" class="container text-center mt-3" lang="fr" hidden>
        <div id="simulationToolbar" class="d-flex flex-wrap justify-content-center align-items-center gap-2">
            <label class="d-flex align-items-center gap-2">
                Couleur
                <select id="simulationColor" class="form-select form-select-sm w-auto" disabled>
                    <option value="1">Bleu</option>
                    <option value="2">Jaune</option>
                </select>
            </label>
            <label class="d-flex align-items-center gap-2">
                Stratégie
                <select id="simulationStrategy" class="form-select form-select-sm w-auto" disabled></select>
            </label>
            <button id="startSimulation" class="btn btn-primary" type="button" disabled>Démarrer le match</button>
            <button id="resetSimulation" class="btn btn-danger" type="button" disabled>Reset</button>
        </div>
        <p id="simulationMessage" class="mb-0" role="status"></p>
    </div>

    <!-- Canvas element where we will draw shapes and images -->
    <canvas id="displayCanvas" width="3300" height="2300" class="mt-3 justify-content-center align-items-center"></canvas>


    <h3 class="m-2" id="stateLabel">Robot State : </h3>
    <h3 class="m-2" id="scoreLabel">Score : </h3>
    <h3 class="m-2" id="colorLabel">Color : </h3>
    <h3 class="m-2" id="timeLabel">Time : </h3>

    <script>
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');

        const stateLabel = document.getElementById('stateLabel');
        const scoreLabel = document.getElementById('scoreLabel');
        const colorLabel = document.getElementById('colorLabel');
        const timeLabel = document.getElementById('timeLabel');
        const simulationControls = document.getElementById('simulationControls');
        const colorSelect = document.getElementById('simulationColor');
        const strategySelect = document.getElementById('simulationStrategy');
        const startButton = document.getElementById('startSimulation');
        const resetButton = document.getElementById('resetSimulation');
        const simulationMessage = document.getElementById('simulationMessage');
        const simulation = location.pathname === '/simulation/';
        const commandError = 'La commande a échoué. Réessayez.';
        const unavailableMessage = 'Simulateur indisponible.';
        const tableWidth = canvas.width;
        const tableHeight = canvas.height;
        let lastSimulationReply = performance.now();
        let latestFrame;
        let displayedPose;
        let frameTime;
        let animation;
        let polling;
        let starting = false;
        let commandFailed = false;

        function setSimulationMessage(message) {
            if (simulationMessage.textContent !== message) simulationMessage.textContent = message;
        }

        function setSimulationControls(ready, connected) {
            startButton.disabled = colorSelect.disabled = strategySelect.disabled = !ready;
            resetButton.disabled = !connected;
        }

        if (simulation) {
            document.getElementById('simulationToolbar').append(timeLabel, scoreLabel);
            simulationControls.hidden = false;
            document.title = 'Simulation';
            document.getElementById('pageTitle').textContent = 'Simulateur CDFR';
            document.body.classList.add('simulation');
            setSimulationMessage('Connexion au simulateur…');
            new ResizeObserver(([{ contentRect }]) => {
                const scale = Math.min(devicePixelRatio, 2);
                canvas.width = Math.round(contentRect.width * scale);
                canvas.height = Math.round(contentRect.height * scale);
                ctx.setTransform(canvas.width / tableWidth, 0, 0, canvas.height / tableHeight, 0, 0);
                if (latestFrame && !document.hidden) draw(latestFrame, displayedPose);
            }).observe(canvas);
        }

        async function sendSimulationCommand(command, settings) {
            commandFailed = false;
            setSimulationMessage('');
            try {
                const response = await fetch('/simulation/' + command, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                if (!response.ok) throw new Error(response.statusText);
            } catch (error) {
                commandFailed = true;
                setSimulationMessage(commandError);
            }
        }

        startButton.addEventListener('click', async () => {
            starting = true;
            setSimulationControls(false, true);
            await sendSimulationCommand('start', { color: Number(colorSelect.value), strategy: strategySelect.value });
            starting = false;
        });
        resetButton.addEventListener('click', () => sendSimulationCommand('reset'));

        const centerX = tableWidth / 2;
        const centerY = tableHeight / 2;

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function pollData(signal) {
            while (!signal.aborted) await sleep(await getData(signal));
        }

        function updateVisibility() {
            polling?.abort();
            cancelAnimationFrame(animation);
            if (document.hidden) return;
            if (latestFrame) draw(latestFrame, displayedPose);
            lastSimulationReply = performance.now();
            polling = new AbortController();
            pollData(polling.signal);
        }

        async function getData(signal) {
            try {
                const response = simulation
                    ? await fetch('/simulation/view', { method: 'POST', signal })
                    : await fetch('/get_global', { signal });
                if (signal.aborted) return 0;
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                const data = await response.json();
                if (signal.aborted) return 0;
                let robotStatus = data["status"];
                if (robotStatus == 0)
                    stateLabel.innerHTML = "Robot State : Init";
                else if (robotStatus == 1)
                    stateLabel.innerHTML = "Robot State : Initialize";
                else if (robotStatus == 3)
                    stateLabel.innerHTML = "Robot State : Waiting for Start";
                else if (robotStatus == 4)
                    stateLabel.innerHTML = "Robot State : Running";
                else if (robotStatus == 5)
                    stateLabel.innerHTML = "Robot State : Fin";
                else if (robotStatus == 6)
                    stateLabel.innerHTML = "Robot State : Local Test";
                else if (robotStatus == 7)
                    stateLabel.innerHTML = "Robot State : Manual";
                else
                    stateLabel.innerHTML = "Robot State : Undefined";
                
                scoreLabel.textContent = "Score : " + data["score"];

                let robotColor = data["table"]["colorTeam"];
                if (robotColor == 1)
                    colorLabel.innerHTML = "Color : Blue";
                else if (robotColor == 2)
                    colorLabel.innerHTML = "Color : Yellow";
                else
                    colorLabel.innerHTML = "Color : Undefined";

                if (simulation) {
                    animateSimulation(data);
                    const firstSnapshot = strategySelect.options.length === 0;
                    if (firstSnapshot) {
                        for (const strategy of data.strategies) strategySelect.add(new Option(strategy));
                    }
                    if (firstSnapshot || robotStatus === 4 || robotStatus === 5) {
                        if (robotColor) colorSelect.value = robotColor;
                        if (data.table.strategy) strategySelect.value = data.table.strategy;
                    }
                    lastSimulationReply = performance.now();
                    setSimulationMessage(commandFailed ? commandError : '');
                    setSimulationControls(!starting && robotStatus === 3 && !!strategySelect.value, true);
                    timeLabel.textContent = `Temps écoulé ${(data.elapsedMs / 1000).toFixed(1)} s`;
                } else {
                    draw(data);
                    timeLabel.textContent = "Time : " + data["table"]["startTime"];
                }

                statusDot.style.backgroundColor = 'green';
                return simulation ? 100 : 10;
            } catch (error) {
                if (signal.aborted) return 0;
                if (simulation) {
                    if (performance.now() - lastSimulationReply > 1200) {
                        setSimulationControls(false, false);
                        statusDot.style.backgroundColor = 'red';
                        setSimulationMessage(unavailableMessage);
                    }
                    return 200;
                }
                console.error('Failed to fetch data:', error);
                statusDot.style.backgroundColor = 'red';
                return 200;
            }
        }

        function animateSimulation(data) {
            const target = data.pos;
            const previous = latestFrame;
            if (previous && previous.status === data.status && previous.elapsedMs === data.elapsedMs &&
                previous.pos.x === target.x && previous.pos.y === target.y && previous.pos.a === target.a) return;

            cancelAnimationFrame(animation);
            const now = performance.now();
            const from = displayedPose;
            const duration = Math.max(20, Math.min(now - frameTime, 150));
            frameTime = now;
            latestFrame = data;
            if (data.status !== 4 || previous?.status !== 4 || data.elapsedMs < previous.elapsedMs ||
                (from.x === target.x && from.y === target.y && from.a === target.a)) {
                displayedPose = target;
                draw(data);
                return;
            }
            const angleDelta = (target.a - from.a + 540) % 360 - 180;
            function frame(time) {
                const progress = Math.max(0, Math.min((time - now) / duration, 1));
                displayedPose = {
                    x: from.x + (target.x - from.x) * progress,
                    y: from.y + (target.y - from.y) * progress,
                    a: from.a + angleDelta * progress
                };
                draw(data, displayedPose);
                if (progress < 1) animation = requestAnimationFrame(frame);
            }
            animation = requestAnimationFrame(frame);
        }

        function draw(data, pose = data.pos) {
            ctx.clearRect(0, 0, tableWidth, tableHeight);

            if (data["costmap"]) {
                drawCostmap(data["costmap"]);
            }

            // Draw robot
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'white';
            drawRobot(ctx, pose.y, pose.x, pose.a);

            //Draws an arrow of the target position
            drawArrow(ctx, data["target_pos"]["y"], data["target_pos"]["x"], data["target_pos"]["a"]);

            if (!simulation) {
                // Draw opponent
                ctx.strokeStyle = 'white';
                ctx.beginPath();
                ctx.arc(data["table"]["pos_opponent"]["y"] + centerX, data["table"]["pos_opponent"]["x"] + centerY, 150, 0, Math.PI * 2);
                ctx.closePath();
                ctx.stroke();

                // Draw yellow beacons
                ctx.fillStyle = 'gold';
                ctx.beginPath(); ctx.arc(centerX - 1594, centerY - 950, 20, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX - 1594, centerY + 950, 20, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX + 1594, centerY - 0, 20, 0, Math.PI * 2); ctx.fill();

                // Draw blue beacons
                ctx.fillStyle = 'blue';
                ctx.beginPath(); ctx.arc(centerX + 1594, centerY - 950, 20, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX + 1594, centerY + 950, 20, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(centerX - 1594, centerY - 0, 20, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = 'green';
                data["lidar"].forEach(point => {
                    drawPoint(ctx, point.y, point.x);
                });
            }
            
            // Draw the current robot's path
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'blue';
            ctx.beginPath();
            data["navigation"].forEach(point => {
                ctx.lineTo(point.y + centerX, point.x + centerY);
            });
            ctx.stroke();       
            
            // Draw point in the center
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 10, 0, Math.PI * 2); // x, y, radius, startAngle, endAngle
            ctx.fill();
        }

        //Screen coords, relative to center
        function drawRobot(ctx, x, y, angleDeg) {
            // Convert angle from degrees to radians
            const angleRad = angleDeg * Math.PI / 180;

            // Calculate corner points relative to the center of the square
            const points = [
                { x: -200, y: -115 },
                { x: 0, y: 231 },
                { x: 200, y: -115 },
                { x: -200, y: -115 },
                { x: 0, y: -50 },
                { x: 200, y: -115 }
            ];

            // Rotate points around the center
            const rotatedPoints = points.map(point => {
                return {
                    x: x + centerX + point.x * Math.cos(angleRad) - point.y * Math.sin(angleRad),
                    y: y + centerY - point.x * Math.sin(angleRad) - point.y * Math.cos(angleRad)
                };
            });

            // Set line width
            // Draw the rotated square
            ctx.beginPath();
            for (let i = 0; i < rotatedPoints.length; i++) {
                ctx.lineTo(rotatedPoints[i].x, rotatedPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        }
        
        function drawArrow(ctx, x, y, angleDeg) {
            // Convert angle from degrees to radians
            const angleRad = angleDeg * Math.PI / 180;

            const segSize = 50;

            // Points of an arrow pointing downwards
            const points = [
                { x: -segSize, y: 0 },
                { x: segSize, y: 0 },
                { x: 0, y: 0 },
                { x: 0, y: segSize },
                { x: 0, y: -3 * segSize },
                { x: -segSize, y: -3 * segSize },
                { x: 0, y: -4 * segSize },
                { x: segSize, y: -3 * segSize },
                { x: 0, y: -3 * segSize },
            ];

            // Rotate points around the center
            const rotatedPoints = points.map(point => {
                return {
                    x: x + centerX + point.x * Math.cos(angleRad) - point.y * Math.sin(angleRad),
                    y: y + centerY - point.x * Math.sin(angleRad) - point.y * Math.cos(angleRad)
                };
            });

            ctx.lineWidth = 4;
            ctx.strokeStyle = 'red';
            // Set line width
            // Draw the rotated arrow
            ctx.beginPath();
            for (let i = 0; i < rotatedPoints.length; i++) {
                ctx.lineTo(rotatedPoints[i].x, rotatedPoints[i].y);
            }
            //ctx.closePath();
            ctx.stroke();
        }
        //draws a point from lidar data
        function drawPoint(ctx, x, y) {
            let p_x = centerX + x;
            let p_y = centerY + y;
            ctx.beginPath();
            ctx.roundRect(p_x, p_y, 2, 2, 1);
            ctx.stroke();
        }

        function drawCostmap(costmap) {
            const scale = 25;

            costmap.forEach(cell => {
                const { x, y, cost } = cell;
                ctx.fillStyle = `rgba(100, 0, 0, ${cost / 300})`;
                ctx.fillRect(145 + x * scale, 145 + y * scale, scale, scale);
            });
        }

        document.addEventListener('visibilitychange', updateVisibility);
        updateVisibility();
    </script>

    <!-- Bootstrap JS and dependencies -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load navbar from external file
        fetch('/navbar.html')
            .then(response => response.ok ? response.text() : '')
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });
    </script>

</body>
</html>
