<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Live Table</title>
    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        canvas {
            border: 2px solid white;
            background-color: #f1f1f1;
        }
        .status-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: red;
            transition: background-color 0.5s ease;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Placeholder for the navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-center align-items-center">
            <h1 class="text-white mb-0">2D Table and Robot Display</h1>
            <span class="status-dot ms-3" id="statusDot"></span>
        </div>
    </div>

    <!-- Canvas element where we will draw shapes and images -->
    <canvas id="displayCanvas" width="3300" height="2300" class="mt-3 justify-content-center align-items-center"></canvas>


    <h3 class="m-2" id="stateLabel">Robot State : </h3>
    <h3 class="m-2" id="scoreLabel">Score : </h3>
    <h3 class="m-2" id="colorLabel">Color : </h3>
    <h3 class="m-2" id="timeLabel">Time : </h3>

    <script>
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');

        const stateLabel = document.getElementById('stateLabel');
        const scoreLabel = document.getElementById('scoreLabel');
        const colorLabel = document.getElementById('colorLabel');
        const timeLabel = document.getElementById('timeLabel');

        // Load the vinyl svg
        const svgBackground = new Image();
        svgBackground.src = 'assets/background.svg';
        const svgGrid = new Image();
        svgGrid.src = 'assets/vinyl.svg';

        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;

        let topLeftX = centerX - 3000/2;
        let topLeftY = centerY - 2000/2;
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Function to start the continuous fetching loop
        async function startContinuousFetch() {
            while (true) {  // Infinite loop
                await getData();  // Wait for the data to be fetched and drawn
                await sleep(10);  // Wait for 10ms before the next iteration
            }
        }

        async function getData() {
            try {
                let response = await fetch('/get_global');
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                let data = await response.json();
                draw(data); // Pass the fetched data
                let robotStatus = data["status"];
                if (robotStatus == 0)
                    stateLabel.innerHTML = "Robot State : Init";
                else if (robotStatus == 1)
                    stateLabel.innerHTML = "Robot State : Calibration";
                else if (robotStatus == 2)
                    stateLabel.innerHTML = "Robot State : Waiting for Start";
                else if (robotStatus == 3)
                    stateLabel.innerHTML = "Robot State : Running";
                else if (robotStatus == 4)
                    stateLabel.innerHTML = "Robot State : Fin";
                else if (robotStatus == 5)
                    stateLabel.innerHTML = "Robot State : Manual";
                else if (robotStatus == 6)
                    stateLabel.innerHTML = "Robot State : Local Test";
                else
                    stateLabel.innerHTML = "Robot State : Undefined";
                
                scoreLabel.innerHTML = "Score : " + data["score"];

                let robotColor = data["table"]["colorTeam"];
                if (robotColor == 1)
                    colorLabel.innerHTML = "Color : Blue";
                else if (robotColor == 2)
                    colorLabel.innerHTML = "Color : Yellow";
                else
                    colorLabel.innerHTML = "Color : Undefined";

                timeLabel.innerHTML = "Time : " + data["table"]["startTime"];

                statusDot.style.backgroundColor = 'green';
            } catch (error) {
                console.error('Failed to fetch data:', error);
                statusDot.style.backgroundColor = 'red';
            }
        }

        function draw(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas

            ctx.fillStyle = 'silver';
            ctx.fillRect(topLeftX - 22, topLeftY - 22, 3000+22*2, 2000+22*2); //Top left, size
            ctx.drawImage(svgBackground, topLeftX, topLeftY, 3000, 2000);
            // Dont draw the grid
            //ctx.drawImage(svgGrid, topLeftX, topLeftY, 3000, 2000);

            if (data["pathfinding"]) {
                drawInflated(data["pathfinding"]);
                drawPathfinding(data["pathfinding"]);
            }

            // Draw robot
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'white';
            const hull = data["pathfinding"] ? data["pathfinding"]["robot"] : null;
            drawHeadingMargin(ctx, data["pos"]["y"], data["pos"]["x"],
                              data["pos"]["a"], hull);
            drawRobot(ctx, data["pos"]["y"],
                            data["pos"]["x"],
                            data["pos"]["a"],
                            hull);

            //Draws an arrow of the target position
            drawArrow(ctx, data["target_pos"]["y"], data["target_pos"]["x"], data["target_pos"]["a"]);

            // Draw yellow beacons
            ctx.fillStyle = 'gold';
            ctx.beginPath(); ctx.arc(centerX - 1594, centerY - 950, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX - 1594, centerY + 950, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX + 1594, centerY - 0, 20, 0, Math.PI * 2); ctx.fill();

            // Draw blue beacons
            ctx.fillStyle = 'blue';
            ctx.beginPath(); ctx.arc(centerX + 1594, centerY - 950, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX + 1594, centerY + 950, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX - 1594, centerY - 0, 20, 0, Math.PI * 2); ctx.fill();

            
            ctx.strokeStyle = 'green';
            data["lidar"].forEach(point => {
                drawPoint(ctx, point.y, point.x);
            });
            
            // Draw the current robot's path
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'blue';
            ctx.beginPath();
            data["navigation"].forEach(point => {
                ctx.lineTo(point.y + centerX, point.x + centerY);
            });
            ctx.stroke();       
            
            // Draw point in the center
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 10, 0, Math.PI * 2); // x, y, radius, startAngle, endAngle
            ctx.fill();
        }

        //Screen coords, relative to center
        // Draws the robot hull at (x, y) rotated by angleDeg. The hull comes
        // from the API (`pathfinding.robot`) so the drawing matches what the
        // planner actually inflates; the hardcoded shape is only a fallback
        // for an older backend.
        function drawRobot(ctx, x, y, angleDeg, hull) {
            const angleRad = angleDeg * Math.PI / 180;
            const fallback = [
                { x: 230.94, y: 0 }, { x: -115.47, y: 200 }, { x: -115.47, y: -200 }
            ];
            const local = (hull && hull.length >= 3) ? hull : fallback;

            ctx.beginPath();
            local.forEach((point, i) => {
                const px = x + centerX + point.x * Math.cos(angleRad) - point.y * Math.sin(angleRad);
                const py = y + centerY - point.x * Math.sin(angleRad) - point.y * Math.cos(angleRad);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.closePath();
            ctx.stroke();
        }

        // The planner rotates the hull to the live heading and adds a small
        // clearance. Outline it around the robot so the drawn body matches what
        // was actually planned.
        function drawHeadingMargin(ctx, x, y, angleDeg, hull) {
            const local = (hull && hull.length >= 3) ? hull : null;
            if (!local) return;
            const margin = 5; // mm, matches ROBOT_CLEARANCE
            const a = angleDeg * Math.PI / 180;
            const cos = Math.cos(a), sin = Math.sin(a);

            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(120, 220, 255, 0.45)';
            ctx.beginPath();
            local.forEach((point, i) => {
                // Push each hull vertex outwards along its own direction.
                const len = Math.hypot(point.x, point.y) || 1;
                const px0 = point.x + (point.x / len) * margin;
                const py0 = point.y + (point.y / len) * margin;
                const px = x + centerX + px0 * cos - py0 * sin;
                const py = y + centerY - px0 * sin - py0 * cos;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Translucent layer showing the inflated obstacles, i.e. the region the
        // robot's reference point may not enter. This is C_obs = obstacle (+)
        // (-robot), so it already accounts for the robot's real shape.
        function drawInflated(pathfinding) {
            const shapes = pathfinding["inflated"] || [];
            ctx.lineWidth = 2;

            shapes.forEach(shape => {
                const points = shape["corners"] || shape;
                if (points.length < 3) return;

                ctx.beginPath();
                points.forEach((p, i) => {
                    const px = p["y"] + centerX;
                    const py = p["x"] + centerY;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.closePath();

                if (shape["border"]) {
                    // The table walls cover the whole field, so filling them
                    // would hide everything. Only their inner edge matters.
                    ctx.strokeStyle = 'rgba(90, 100, 120, 0.45)';
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(120, 130, 150, 0.28)';
                    ctx.strokeStyle = 'rgba(90, 100, 120, 0.5)';
                    ctx.fill();
                    ctx.stroke();
                }
            });
        }
        
        //Screen coords, relative to center
        function drawSegment(ctx, ax, ay, bx, by) {
            ctx.beginPath();
            ctx.lineTo(centerX + ax, centerY + ay);
            ctx.lineTo(centerX + bx, centerY + by);
            ctx.stroke();
        }
        function drawArrow(ctx, x, y, angleDeg) {
            // Convert angle from degrees to radians
            const angleRad = angleDeg * Math.PI / 180;

            const segSize = 50;

            // Points of an arrow pointing downwards
            const points = [
                { x: -segSize, y: 0 },
                { x: segSize, y: 0 },
                { x: 0, y: 0 },
                { x: 0, y: segSize },
                { x: 0, y: -3 * segSize },
                { x: -segSize, y: -3 * segSize },
                { x: 0, y: -4 * segSize },
                { x: segSize, y: -3 * segSize },
                { x: 0, y: -3 * segSize },
            ];

            // Rotate points around the center
            const rotatedPoints = points.map(point => {
                return {
                    x: x + centerX + point.x * Math.cos(angleRad) - point.y * Math.sin(angleRad),
                    y: y + centerY - point.x * Math.sin(angleRad) - point.y * Math.cos(angleRad)
                };
            });

            ctx.lineWidth = 4;
            ctx.strokeStyle = 'red';
            // Set line width
            // Draw the rotated arrow
            ctx.beginPath();
            for (let i = 0; i < rotatedPoints.length; i++) {
                ctx.lineTo(rotatedPoints[i].x, rotatedPoints[i].y);
            }
            //ctx.closePath();
            ctx.stroke();
        }
        //draws a point from lidar data
        function drawPoint(ctx, x, y) {
            let p_x = centerX + x;
            let p_y = centerY + y;
            ctx.beginPath();
            ctx.roundRect(p_x, p_y, 2, 2, 1);
            ctx.stroke();
        }

        // Set the canvas to scale with the width of the window
        function resizeCanvas() {
            let ratio = canvas.height / canvas.width;
            canvas.style.width = window.innerWidth + 'px';  // Scale the width to fit the screen width
            canvas.style.height = (window.innerWidth * ratio) + 'px';
        }

        // Obstacles and the planned path, in table millimetres.
        // The canvas uses (0, 0) at its centre with the two axes swapped, and
        // one millimetre is one pixel, so every point maps as (y, x).
        function drawPathfinding(pathfinding) {
            const obstacles = pathfinding["obstacles"] || [];

            // Outline only, so the inflated layer and the path stay readable.
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 3;
            obstacles.forEach(ob => {
                ctx.beginPath();
                ob["corners"].forEach((c, i) => {
                    const px = c["y"] + centerX;
                    const py = c["x"] + centerY;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.closePath();
                ctx.stroke();
            });

            // Planned path, drawn on top of the obstacles.
            const path = pathfinding["path"] || [];
            if (path.length < 2) return;
            ctx.strokeStyle = pathfinding["found"] ? 'rgba(30, 100, 255, 0.9)' : 'rgba(150, 150, 150, 0.9)';
            ctx.lineWidth = 8;
            ctx.beginPath();
            path.forEach((p, i) => {
                const px = p["y"] + centerX;
                const py = p["x"] + centerY;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.stroke();
        }

        // Call the function to resize initially
        resizeCanvas();

        // Optionally, listen for window resize events to adjust the canvas size dynamically
        window.addEventListener('resize', resizeCanvas);

        // Start the continuous fetching loop
        startContinuousFetch();
    </script>

    <!-- Bootstrap JS and dependencies -->
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load navbar from external file
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });
    </script>

</body>
</html>
