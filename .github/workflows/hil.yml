name: HIL

# Hardware checks on the bench: takes the arm64 bundle from the CI run that just
# finished and runs it with --unit-test. See docs/HIL.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  bench:
    # Runs for every branch, but only for CI runs from this repository: a fork
    # PR's artifact must never execute on the bench.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, bench]
    timeout-minutes: 10
    concurrency:
      group: bench
      cancel-in-progress: false

    steps:
      - name: Download the arm64 bundle
        uses: actions/download-artifact@v4
        with:
          name: programCDFR-arm64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bundle

      - name: Unpack
        run: unzip -o bundle/programCDFR-arm64.zip -d bench

      - name: Free the port, the camera and the lidar
        run: sudo systemctl stop programCDFR || true

      - name: Run the hardware checks
        working-directory: bench
        run: |
          log="$RUNNER_TEMP/hil.log"
          sudo ./programCDFR --unit-test 2>&1 | tee "$log"
          if grep -q "HIL FAIL" "$log"; then
            echo "::error::hardware checks reported a failure (see the log above)"
            exit 1
          fi
          if ! grep -q "HIL hardware checks done" "$log"; then
            echo "::error::the checks did not finish"
            exit 1
          fi

      - name: Restart the robot service
        if: always()
        run: sudo systemctl start programCDFR || true
