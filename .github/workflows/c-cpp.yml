name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the image layers in GHCR: pull the image pushed by a previous run
      # and use it as --cache-from, then push the new one. Each Dockerfile is
      # split into layers (clone, then packages), so a Dockerfile or
      # package-list change only re-runs the affected layer. This needs no
      # Actions-internal credentials, unlike buildx's type=gha backend.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the previous images
        run: |
          for arch in x86_64 arm64; do
            docker pull "ghcr.io/${{ github.repository }}/cdfr-builder-$arch:cache" \
              || echo "::notice::No cached image for $arch yet (first run)"
          done

      - name: Build Docker images
        run: |
          for arch in x86_64 arm64; do
            DOCKER_CACHE_IMAGE="ghcr.io/${{ github.repository }}/cdfr-builder-$arch:cache" \
              ./build.sh images "$arch"
          done

      - name: Push the image cache
        # pull_request runs from forks cannot write to GHCR.
        if: github.event_name == 'push'
        run: |
          for arch in x86_64 arm64; do
            docker push "ghcr.io/${{ github.repository }}/cdfr-builder-$arch:cache"
          done

      - name: Build x86_64 and arm64
        run: ./build.sh build

      - name: Run tests (x86_64)
        # TODO: fix the Lidar test so continue-on-error can be removed.
        continue-on-error: true
        run: ./build.sh test

      - name: Package runtime bundles
        run: |
          for arch in x86_64 arm64; do
            dir="build/$arch"
            files="programCDFR html data tests/lidar autoRunInstaller.sh"
            (cd "$dir" && zip -r "../../programCDFR-$arch.zip" $files)
          done

      - name: Upload x86_64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-x86_64
          path: programCDFR-x86_64.zip
          if-no-files-found: error

      - name: Upload arm64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-arm64
          path: programCDFR-arm64.zip
          if-no-files-found: error
