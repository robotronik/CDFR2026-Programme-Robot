name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker images
        run: ./build.sh images

      - name: Build x86_64 and arm64
        run: ./build.sh build

      - name: Run tests (x86_64)
        run: ./build.sh test

      - name: Package runtime bundles
        run: |
          for arch in x86_64 arm64; do
            dir="build/$arch"
            files="programCDFR html data tests/lidar autoRunInstaller.sh"
            if [ -f "$dir/pi_detect_aruco.py" ]; then
              files="$files pi_detect_aruco.py"
            fi
            (cd "$dir" && zip -r "../../programCDFR-$arch.zip" $files)
          done

      - name: Upload x86_64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-x86_64
          path: programCDFR-x86_64.zip
          if-no-files-found: error

      - name: Upload arm64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-arm64
          path: programCDFR-arm64.zip
          if-no-files-found: error
