name: CI

on: push

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    env:
      DOCKER_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}/cdfr2026-programme-robot
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the image layers in GHCR: build.sh pulls the image pushed by a
      # previous run and uses it as --cache-from, then the new one is pushed, so
      # only layers whose input changed are rebuilt. This needs no
      # Actions-internal credentials, unlike buildx's type=gha backend.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ${{ matrix.arch }} image
        run: ./build.sh images ${{ matrix.arch }}

      - name: Build the ${{ matrix.arch }} program
        run: ./build.sh build ${{ matrix.arch }}

      - name: Push the image cache
        # Only main writes the cache, so branches can't overwrite it; PR runs read it.
        if: github.ref == 'refs/heads/main'
        run: docker push "$DOCKER_CACHE_REGISTRY/cdfr-builder-${{ matrix.arch }}:cache"

      - name: Run tests
        if: matrix.arch == 'x86_64'
        run: ./build.sh test

      - name: Package runtime bundle
        run: |
          cd "build/${{ matrix.arch }}"
          zip -r "../../programCDFR-${{ matrix.arch }}.zip" programCDFR html data autoRunInstaller.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-${{ matrix.arch }}
          path: programCDFR-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Hardware checks on the bench, run on the arm64 bundle just built. See
  # docs/HIL.md. Skipped for fork PRs: their artifact must never execute on the
  # bench.
  bench:
    needs: build-and-test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bench]
    timeout-minutes: 10
    # One bench: never two runs at once.
    concurrency:
      group: bench
      cancel-in-progress: false

    steps:
      - name: Download the arm64 bundle
        uses: actions/download-artifact@v4
        with:
          name: programCDFR-arm64
          path: bundle

      - name: Unpack
        run: unzip -o bundle/programCDFR-arm64.zip -d bench

      - name: Free the port, the camera and the lidar
        run: sudo systemctl stop programCDFR || true

      - name: Run the hardware checks
        working-directory: bench
        run: |
          log="$RUNNER_TEMP/hil.log"
          sudo ./programCDFR --unit-test 2>&1 | tee "$log"
          if grep -q "HIL FAIL" "$log"; then
            echo "::error::hardware checks reported a failure (see the log above)"
            exit 1
          fi
          if ! grep -q "HIL hardware checks done" "$log"; then
            echo "::error::the checks did not finish"
            exit 1
          fi

      - name: Restart the robot service
        if: always()
        run: sudo systemctl start programCDFR || true
