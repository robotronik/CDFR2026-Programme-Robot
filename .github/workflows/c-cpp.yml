name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker images
        run: ./build.sh images

      - name: Build x86_64 and arm64
        run: ./build.sh build

      - name: Run tests (x86_64)
        run: ./build.sh test

      - name: Upload x86_64 executable
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-x86_64
          path: build/x86_64/programCDFR
          if-no-files-found: error

      - name: Upload arm64 executable
        uses: actions/upload-artifact@v4
        with:
          name: programCDFR-arm64
          path: build/arm64/programCDFR
          if-no-files-found: error
